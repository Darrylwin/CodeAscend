name: code_ascend
description: "Application de quizs pour la programmation"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  equatable: ^2.0.8
  dartz: ^0.10.1
  dio: ^5.9.0
  get_it: ^9.2.0
  shared_preferences: ^2.3.3
  go_router: ^15.1.2
  intl: ^0.20.2
  flutter_bloc: ^9.1.1
  connectivity_plus: ^4.0.2
  flutter_svg: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
  image_path: "assets/logo.png"

flutter:

  uses-material-design: true

  assets:
    - assets/animations/
    - assets/logo.png
  #   - images/a_dot_ham.jpeg

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Bold.ttf
          weight: 400
        - asset: assets/fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_18pt-Bold.ttf
          weight: 700